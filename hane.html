<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hane Dönüşümü</title>
<style>
  :root {
    color-scheme: light;
    --surface-1: #fcfcfb;
    --page: #f9f9f7;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --grid: #e1e0d9;
    --baseline: #c3c2b7;
    --border: rgba(11,11,11,0.10);
    --elec: #2a78d6;
    --elec-track: #cde2fb;
    --fossil: #eb6834;
    --good: #006300;
    --shadow: 0 1px 3px rgba(0,0,0,0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface-1: #1a1a19; --page: #0d0d0d;
      --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #898781;
      --grid: #2c2c2a; --baseline: #383835; --border: rgba(255,255,255,0.10);
      --elec: #3987e5; --elec-track: #184f95; --fossil: #d95926; --good: #0ca30c;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1: #1a1a19; --page: #0d0d0d;
    --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #898781;
    --grid: #2c2c2a; --baseline: #383835; --border: rgba(255,255,255,0.10);
    --elec: #3987e5; --elec-track: #184f95; --fossil: #d95926; --good: #0ca30c;
    --shadow: none;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page); color: var(--text-primary);
    padding: 24px 16px 48px;
  }
  .wrap { max-width: 980px; margin: 0 auto; }
  header { margin-bottom: 18px; }
  h1 { font-size: 21px; font-weight: 650; }
  .sub { color: var(--text-secondary); font-size: 13px; margin-top: 4px; max-width: 700px; }
  .card {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px;
    padding: 18px 20px; box-shadow: var(--shadow); margin-bottom: 14px;
  }
  .sitenav { display: flex; gap: 6px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  .sitenav .brand { font-size: 13px; font-weight: 650; color: var(--text-secondary); margin-right: 10px; }
  .sitenav a {
    font-size: 13px; text-decoration: none; padding: 6px 12px; border-radius: 8px;
    color: var(--text-secondary); border: 1px solid transparent;
  }
  .sitenav a:hover { border-color: var(--border); }
  .sitenav a.active { background: var(--surface-1); border: 1px solid var(--border); color: var(--text-primary); font-weight: 600; box-shadow: var(--shadow); }
  .lang { margin-left: auto; display: flex; gap: 4px; }
  .lang button {
    font: inherit; font-size: 12px; padding: 4px 10px; border-radius: 7px;
    border: 1px solid transparent; background: none; color: var(--text-muted); cursor: pointer;
  }
  .lang button.active { border-color: var(--border); background: var(--surface-1); color: var(--text-primary); font-weight: 600; box-shadow: var(--shadow); }
  #loadErr { display: none; padding: 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-1); color: var(--text-secondary); font-size: 13px; margin-bottom: 14px; }

  .tr-label { font-size: 12.5px; color: var(--text-secondary); }
  .tr-num { font-size: 30px; font-weight: 650; line-height: 1.15; }
  .tr-delta { font-size: 12.5px; color: var(--good); font-weight: 600; min-height: 16px; }
  .tr-bar { position: relative; height: 18px; border-radius: 6px; background: var(--elec-track); margin-top: 10px; overflow: visible; }
  .tr-fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--elec); border-radius: 6px 4px 4px 6px; }
  .marker { position: absolute; top: -5px; bottom: -5px; width: 2px; background: var(--text-muted); }
  .marker.target { background: var(--text-primary); }
  .marker-label { position: absolute; top: -22px; transform: translateX(-50%); font-size: 11px; color: var(--text-secondary); white-space: nowrap; }

  .hero-top { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .hero-num { font-size: 48px; font-weight: 650; line-height: 1; }
  .hero-label { font-size: 14px; color: var(--text-secondary); max-width: 320px; }
  .stat-row { display: flex; gap: 28px; margin-top: 14px; flex-wrap: wrap; }
  .stat .l { font-size: 12px; color: var(--text-muted); }
  .stat .v { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat .d { font-size: 12px; color: var(--good); font-weight: 600; }
  button.reset {
    font: inherit; font-size: 13px; padding: 7px 14px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary);
    cursor: pointer; box-shadow: var(--shadow);
  }
  .chart-title { font-size: 15px; font-weight: 650; }
  .chart-sub { font-size: 12.5px; color: var(--text-secondary); margin: 3px 0 12px; max-width: 720px; }
  .legend { display: flex; gap: 16px; align-items: center; font-size: 12.5px; color: var(--text-secondary); margin: 4px 0 8px; flex-wrap: wrap; }
  .key { display: inline-flex; align-items: center; gap: 6px; }
  .sw { width: 12px; height: 12px; border-radius: 3px; }
  .rowlab { font-size: 11px; color: var(--text-muted); margin: 10px 0 4px; }

  .comp-bar { position: relative; height: 26px; border-radius: 6px; overflow: hidden; background: var(--grid); }
  .comp-bar .seg { position: absolute; top: 0; bottom: 0; }

  .pen-bar {
    position: relative; height: 26px; border-radius: 6px;
    background: var(--elec-track); cursor: ew-resize; touch-action: none;
  }
  .pen-bar:focus-visible { outline: 2px solid var(--elec); outline-offset: 2px; }
  .pen-fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--elec); border-radius: 6px 4px 4px 6px; }
  .handle {
    position: absolute; top: 50%; transform: translate(-50%, -50%);
    width: 14px; height: 34px; border-radius: 7px;
    background: var(--elec); border: 2px solid var(--surface-1);
    box-shadow: 0 1px 4px rgba(0,0,0,0.25); pointer-events: none;
  }
  .base-tick { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--text-muted); }
  .pen-val {
    position: absolute; top: 50%; transform: translateY(-50%);
    font-size: 12.5px; font-weight: 650; pointer-events: none; font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .axis { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted); margin-top: 5px; font-variant-numeric: tabular-nums; }

  .cons-bar { position: relative; height: 22px; }
  .seg2 { position: absolute; top: 0; bottom: 0; border-radius: 4px; }
  .seg2.e { background: var(--elec); }
  .seg2.f { background: var(--fossil); }
  .ghost { position: absolute; top: 0; bottom: 0; border-radius: 4px; border: 1px dashed var(--baseline); }
  .cons-val { position: absolute; top: 50%; transform: translateY(-50%); font-size: 11.5px; color: var(--text-secondary); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .saved { color: var(--good); font-weight: 600; }
  footer { font-size: 11.5px; color: var(--text-muted); line-height: 1.6; margin-top: 18px; }
  footer p { margin-bottom: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <nav class="sitenav">
    <span class="brand">elektrifikasyon.org</span>
    <a href="index.html" data-i18n="navSim"></a>
    <a href="ornek-hesaplama.html" data-i18n="navOrnek"></a>
    <a href="otomobil.html" data-i18n="navOto"></a>
    <a href="hane.html" class="active" data-i18n="navHane"></a>
    <div class="lang">
      <button id="langTr" type="button">TR</button>
      <button id="langEn" type="button">EN</button>
    </div>
  </nav>
  <header>
    <h1 data-i18n="h1"></h1>
    <div class="sub" data-i18n="sub"></div>
  </header>

  <div id="loadErr" data-i18n="loadErr"></div>

  <div class="card">
    <div class="tr-label" data-i18n="trLabel"></div>
    <div class="tr-num" id="trShare">—</div>
    <div class="tr-delta" id="trDelta"></div>
    <div class="tr-bar" id="trBar" style="margin-top:26px">
      <div class="tr-fill" id="trFill"></div>
    </div>
    <div class="axis"><span id="axL"></span><span id="axR"></span></div>
  </div>

  <div class="card">
    <div class="hero-top">
      <div class="hero-num" id="heroShare">—</div>
      <div class="hero-label" data-i18n="heroLabel"></div>
      <div style="margin-left:auto"><button class="reset" id="resetAll" data-i18n="resetBtn"></button></div>
    </div>
    <div class="stat-row">
      <div class="stat"><div class="l" data-i18n="stHpL"></div><div class="v" id="stHp"></div><div class="d" id="stHpD"></div></div>
      <div class="stat"><div class="l" data-i18n="stTotL"></div><div class="v" id="stTot"></div><div class="d" id="stTotD"></div></div>
      <div class="stat"><div class="l" data-i18n="stElecL"></div><div class="v" id="stElec"></div></div>
      <div class="stat"><div class="l" data-i18n="stGasL"></div><div class="v" id="stGas"></div></div>
    </div>
  </div>

  <div class="card">
    <div class="chart-title" data-i18n="cTitle"></div>
    <div class="chart-sub" data-i18n="cSub"></div>
    <div class="legend" id="compLegend"></div>
    <div class="rowlab" data-i18n="rowComp"></div>
    <div class="comp-bar" id="compBar"></div>
    <div class="rowlab" data-i18n="rowSlider"></div>
    <div class="pen-bar" id="bar" tabindex="0" role="slider" aria-label="Heat-pump share of gas-heated homes" aria-valuemin="0" aria-valuemax="100">
      <div class="pen-fill" id="fill"></div>
      <div class="base-tick" id="tick"></div>
      <div class="handle" id="hnd"></div>
      <div class="pen-val" id="pv"></div>
    </div>
    <div class="axis"><span id="axS0"></span><span id="axS50"></span><span id="axS100"></span></div>

    <div class="rowlab" data-i18n="rowEnergy"></div>
    <div class="cons-bar">
      <div class="ghost" id="eGhost"></div>
      <div class="seg2 e" id="eSegE"></div>
      <div class="seg2 f" id="eSegF"></div>
      <div class="cons-val" id="eVal"></div>
    </div>
  </div>

  <footer>
    <p data-i18n="footMethod"></p>
    <p data-i18n="footTr"></p>
    <p data-i18n="footRead"></p>
    <p data-i18n="footCopy"></p>
  </footer>
</div>

<script>
'use strict';
// Hesaplar sunucu tarafında yapılır (/api).
const API = location.hostname === 'localhost'
  ? ''
  : 'https://elektrifikasyon.bahadirsgumus.workers.dev';

let LANG = localStorage.getItem('elx-lang') === 'en' ? 'en' : 'tr';
const LOC = () => LANG === 'en' ? 'en-GB' : 'tr-TR';

const STR = {
  navSim:   { tr: 'Simülatör', en: 'Simulator' },
  navOrnek: { tr: 'Elektrifikasyon Oranı Yanılgısı', en: 'Electrification Rate Fallacy' },
  navOto:   { tr: 'Otomobillerin Elektrifikasyonu', en: 'Car Electrification' },
  navHane:  { tr: 'Hanelerin Elektrifikasyonu', en: 'Home Electrification' },
  title:    { tr: 'Hane Dönüşümü', en: 'The Home Heating Transition' },
  h1:       { tr: 'Hane Dönüşümü', en: 'The Home Heating Transition' },
  sub:      { tr: 'Türkiye’de doğal gazla ısınan yaklaşık 18 milyon hane eşdeğeri var (ortalama 950 m³/yıl). ' +
                  'Kaydırıcıyla ısı pompasına geçen hane sayısını artırın; hane sayısı bazlı dönüşüm oranı ile ' +
                  'enerji bazlı elektrifikasyon oranının nasıl ayrıştığını görün.',
              en: 'Türkiye has roughly 18 million gas-heated household equivalents (averaging 950 m³ a year). ' +
                  'Raise the number of homes switching to heat pumps, and see how the household-count conversion ' +
                  'rate and the energy-based electrification rate diverge.' },
  loadErr:  { tr: 'Hesap servisine ulaşılamadı. Sayfayı yenileyin; sorun sürerse daha sonra tekrar deneyin.',
              en: 'The calculation service could not be reached. Refresh the page; if the problem persists, try again later.' },
  trLabel:  { tr: "Türkiye'nin nihai enerji tüketiminde elektriğin payı (hane dönüşümünün etkisiyle)",
              en: "Türkiye's share of electricity in final energy consumption (with the home transition applied)" },
  heroLabel:{ tr: 'Doğalgazlı hanelerin ısınma enerjisinde elektriğin payı', en: 'Share of electricity in gas-heated homes’ heating energy' },
  resetBtn: { tr: '↺ Bugüne dön', en: '↺ Back to today' },
  stHpL:    { tr: 'Isı pompalı hane', en: 'Heat-pump homes' },
  stTotL:   { tr: 'Isınmanın yıllık enerjisi', en: 'Annual heating energy' },
  stElecL:  { tr: 'Elektrik', en: 'Electricity' },
  stGasL:   { tr: 'Doğal gaz', en: 'Natural gas' },
  cTitle:   { tr: 'Hane bileşimi ve dönüşüm kaydırıcısı', en: 'Household mix and the conversion slider' },
  cSub:     { tr: 'Kaydırıcı, ısı pompasına geçen hanelerin doğalgazlı hane stoku içindeki <b>adet</b> payını belirler ' +
                  '(%100 ≈ 18 milyon hane). Isı pompası aynı ısınmayı %60 daha az enerjiyle sağlar: 950 m³ gaz yerine ' +
                  'yaklaşık 4 MWh elektrik.',
              en: 'The slider sets the heat-pump homes’ share of the gas-heated stock <b>by count</b> (100% ≈ 18 million ' +
                  'homes). A heat pump delivers the same warmth with 60% less energy: roughly 4 MWh of electricity in ' +
                  'place of 950 m³ of gas.' },
  rowComp:  { tr: 'Hane bileşimi (adet)', en: 'Household mix (number of homes)' },
  rowSlider:{ tr: 'Isı pompalı hane adedi — sürükleyin', en: 'Number of heat-pump homes — drag' },
  rowEnergy:{ tr: 'Isınmanın yıllık enerji tüketimi (bugüne göre)', en: 'Annual heating energy (relative to today)' },
  tickTitle:{ tr: 'Bugünkü durum', en: 'Today' },
  adet:     { tr: 'hane', en: 'homes' },
  vsToday:  { tr: '(bugüne göre)', en: '(vs today)' },
  today0:   { tr: 'bugünkü durum', en: 'today’s level' },
  deltaTpl: { tr: '+{d} puan (bugün: {b})', en: '+{d} pts (today: {b})' },
  mkToday:  { tr: 'Bugün: %21,80', en: 'Today: 21.80%' },
  mkTarget: { tr: 'Hedef: %35', en: 'Target: 35%' },
  footMethod:{ tr: '<b>Yöntem:</b> ETKB 2024 dengesindeki konut doğal gazı toplamı (15,6 milyon TEP ≈ 182 TWh), ortalama ' +
                   '950 m³/yıl (≈10,1 MWh) tüketen ~18 milyon hane eşdeğerine bölünür. Isı pompasına geçen hane aynı ' +
                   'ısınmayı %60 daha az enerjiyle sağlar (≈4,0 MWh elektrik). Dönüşüm hane stokundan orantılı yapılır; ' +
                   'kömür, LPG veya oduna dayalı ısınma bu sayfanın kapsamı dışındadır.',
               en: '<b>Method:</b> Residential natural gas in the 2024 ETKB balance (15.6 Mtoe ≈ 182 TWh) is divided into ' +
                   '~18 million household equivalents averaging 950 m³ (≈10.1 MWh) a year. A converted home delivers the ' +
                   'same warmth with 60% less energy (≈4.0 MWh of electricity). Conversion is proportional across the ' +
                   'stock; coal-, LPG- or wood-based heating is outside this page’s scope.' },
  footTr:   { tr: '<b>Türkiye etkisi:</b> En üstteki oran, ETKB 2024 dengesinde enerji dışı tüketim hariç nihai tüketim ' +
                  '(elektrik 26.340,5 / toplam 120.829,9 bin TEP, pay %21,80) üzerine yalnızca bu sayfadaki hane ' +
                  'dönüşümünün eklediği elektrik ve azalttığı gaz işlenerek hesaplanır; diğer tüm sektörler sabit kabul ' +
                  'edilir. 1 bin TEP = 11,63 GWh.',
              en: '<b>National impact:</b> The rate at the top applies only this page’s home-transition deltas — added ' +
                  'electricity and displaced gas — to 2024 final consumption excluding non-energy use (electricity ' +
                  '26,340.5 / total 120,829.9 ktoe, share 21.80%); all other sectors are held constant. 1 ktoe = 11.63 GWh.' },
  footRead: { tr: '<b>Okuma:</b> Hanelerin yarısı ısı pompasına geçse bile ısınma enerjisinde elektriğin payı yalnızca ' +
                  '~%29 olur — ısı pompası o kadar az enerji kullanır ki, enerji payı hane payının hep altında kalır. ' +
                  'Tam dönüşümde ısınma enerjisi 182 TWh gazdan ~73 TWh elektriğe iner; Türkiye’nin genel oranı tek ' +
                  'başına bu dönüşümle %21,80’den ~%29,2’ye çıkar.',
              en: '<b>How to read it:</b> Even with half the homes converted, electricity’s share of heating energy is ' +
                  'only ~29% — a heat pump uses so little energy that the energy share always trails the household ' +
                  'share. Fully converted, heating falls from 182 TWh of gas to ~73 TWh of electricity, and this ' +
                  'transition alone lifts Türkiye’s national rate from 21.80% to ~29.2%.' },
  footCopy: { tr: '© 2026 elektrifikasyon.org — Tüm hakları saklıdır.', en: '© 2026 elektrifikasyon.org — All rights reserved.' },
};
const T = k => STR[k][LANG];

const fmtNum = (v, d) => v.toLocaleString(LOC(), { minimumFractionDigits: d, maximumFractionDigits: d });
const fmtPctN = (v100, d) => LANG === 'en' ? fmtNum(v100, d) + '%' : '%' + fmtNum(v100, d);
const fmtTWh1 = v => fmtNum(v, 1) + ' TWh';
const fmtPct1 = v => fmtPctN(v * 100, 1);
const fmtAdet = v => Math.round(v).toLocaleString(LOC());
const axPct = v => LANG === 'en' ? v + '%' : '%' + v;

let MODEL = null;
let sigma = 0;

async function getJSON(path, opts) {
  const sep = path.includes('?') ? '&' : '?';
  const r = await fetch(API + path + (opts && opts.method === 'POST' ? '' : sep + 'lang=' + LANG), opts);
  if (!r.ok) throw new Error('api ' + r.status);
  return r.json();
}

function applyStatic() {
  document.documentElement.lang = LANG;
  document.title = T('title');
  document.querySelectorAll('[data-i18n]').forEach(el => { el.innerHTML = T(el.dataset.i18n); });
  document.getElementById('axL').textContent = axPct(0);
  document.getElementById('axR').textContent = axPct(50);
  document.getElementById('axS0').textContent = axPct(0);
  document.getElementById('axS50').textContent = axPct(50);
  document.getElementById('axS100').textContent = axPct(100);
  document.getElementById('tick').title = T('tickTitle');
  document.getElementById('langTr').classList.toggle('active', LANG === 'tr');
  document.getElementById('langEn').classList.toggle('active', LANG === 'en');
}

let busy = false, queued = false;
async function requestHane() {
  if (busy) { queued = true; return; }
  busy = true;
  try {
    do { queued = false; await hane(); } while (queued);
  } finally { busy = false; }
}
async function hane() {
  try {
    const res = await getJSON('/api/hane', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sigma }),
    });
    applyHane(res);
  } catch (e) {
    document.getElementById('loadErr').style.display = 'block';
  }
}

function setSliderVisual(s, homes) {
  const p = s * 100;
  document.getElementById('fill').style.width = p + '%';
  document.getElementById('hnd').style.left = p + '%';
  const pv = document.getElementById('pv');
  pv.textContent = `${fmtAdet(homes)} ${T('adet')} (${fmtPctN(s * 100, 1)})`;
  if (p > 32) { pv.style.cssText = `left:${p - 1.2}%; transform:translate(-100%,-50%); color:#fff;`; }
  else { pv.style.cssText = `left:${p + 2}%; transform:translateY(-50%); color:var(--text-primary);`; }
  document.getElementById('bar').setAttribute('aria-valuenow', Math.round(p));
}

function applyHane(res) {
  document.getElementById('loadErr').style.display = 'none';

  document.getElementById('trShare').textContent = fmtPctN(res.trShare * 100, 2);
  document.getElementById('trFill').style.width = Math.min(100, res.trShare / 0.5 * 100) + '%';
  const dPuan = (res.trShare - MODEL.trBase) * 100;
  document.getElementById('trDelta').textContent = dPuan > 0.005
    ? T('deltaTpl').replace('{d}', fmtNum(dPuan, 2)).replace('{b}', fmtPctN(MODEL.trBase * 100, 2))
    : T('today0');

  document.getElementById('heroShare').textContent = fmtPct1(res.share);
  document.getElementById('stHp').textContent = fmtAdet(res.hpHomes) + ' ' + T('adet');
  document.getElementById('stHpD').textContent = res.hpHomes > MODEL.nHomes / 1000 ? `+${fmtAdet(res.hpHomes)}` : '';
  document.getElementById('stTot').textContent = fmtTWh1(res.totTWh);
  document.getElementById('stTotD').textContent = res.savedTWh > 0.05 ? `−${fmtTWh1(res.savedTWh)} ${T('vsToday')}` : '';
  document.getElementById('stElec').textContent = fmtTWh1(res.elecTWh);
  document.getElementById('stGas').textContent = fmtTWh1(res.gasTWh);

  let html = '', xacc = 0;
  const gapPct = 0.15;
  for (const c of res.comp) {
    const w = c.count / MODEL.nHomes * 100;
    if (w <= 0.01) continue;
    const color = c.id === 'hp' ? 'var(--elec)' : 'var(--fossil)';
    html += `<div class="seg" style="left:${xacc + (xacc > 0 ? gapPct : 0)}%; width:${Math.max(0, w - (xacc > 0 ? gapPct : 0))}%; background:${color}"></div>`;
    xacc += w;
  }
  document.getElementById('compBar').innerHTML = html;

  const scale = MODEL.baseTot;
  const wE = res.elecTWh / scale * 100, wF = res.gasTWh / scale * 100;
  document.getElementById('eGhost').style.cssText = 'left:0; width:100%';
  document.getElementById('eSegE').style.cssText = `left:0; width:${wE}%`;
  document.getElementById('eSegF').style.cssText = `left:${wE + 0.25}%; width:${Math.max(0, wF - 0.25)}%`;
  const evEl = document.getElementById('eVal');
  evEl.style.left = Math.max(100, wE + wF) + 1.2 + '%';
  evEl.innerHTML = fmtTWh1(res.totTWh) + (res.savedTWh > 0.05 ? ` <span class="saved">(−${fmtTWh1(res.savedTWh)})</span>` : '');

  if (!queued) { sigma = res.sigma; setSliderVisual(res.sigma, res.hpHomes); }
}

const bar = document.getElementById('bar');
function setFromEvent(ev) {
  const rect = bar.getBoundingClientRect();
  sigma = Math.max(0, Math.min(1, (ev.clientX - rect.left) / rect.width));
  setSliderVisual(sigma, sigma * MODEL.nHomes);
  requestHane();
}
bar.addEventListener('pointerdown', ev => {
  if (!MODEL) return;
  try { bar.setPointerCapture(ev.pointerId); } catch (e) { /* sentetik olaylarda yok sayılır */ }
  setFromEvent(ev);
  const move = e => setFromEvent(e);
  const up = () => { bar.removeEventListener('pointermove', move); bar.removeEventListener('pointerup', up); };
  bar.addEventListener('pointermove', move);
  bar.addEventListener('pointerup', up);
});
bar.addEventListener('keydown', ev => {
  if (!MODEL) return;
  const step = ev.shiftKey ? 0.10 : 0.01;
  if (ev.key === 'ArrowRight' || ev.key === 'ArrowUp') sigma = Math.min(1, sigma + step);
  else if (ev.key === 'ArrowLeft' || ev.key === 'ArrowDown') sigma = Math.max(0, sigma - step);
  else if (ev.key === 'Home') sigma = 0;
  else return;
  ev.preventDefault();
  setSliderVisual(sigma, sigma * MODEL.nHomes);
  requestHane();
});
bar.addEventListener('dblclick', () => { if (!MODEL) return; sigma = 0; setSliderVisual(0, 0); requestHane(); });
document.getElementById('resetAll').addEventListener('click', () => {
  if (!MODEL) return;
  sigma = 0; setSliderVisual(0, 0); requestHane();
});

function buildMarkers() {
  const trBar = document.getElementById('trBar');
  trBar.querySelectorAll('.marker, .marker-label').forEach(el => el.remove());
  for (const m of [{ v: MODEL.trBase * 100, label: T('mkToday'), cls: '' }, { v: 35, label: T('mkTarget'), cls: 'target' }]) {
    const x = m.v / 50 * 100;
    const mk = document.createElement('div');
    mk.className = 'marker ' + m.cls; mk.style.left = x + '%';
    const lb = document.createElement('div');
    lb.className = 'marker-label'; lb.style.left = x + '%'; lb.textContent = m.label;
    trBar.appendChild(mk); trBar.appendChild(lb);
  }
}

async function loadLangData(firstLoad) {
  MODEL = await getJSON('/api/hane/model');
  if (firstLoad) sigma = MODEL.s0;
  document.getElementById('tick').style.left = (MODEL.s0 * 100) + '%';
  document.getElementById('compLegend').innerHTML = MODEL.legend.map(i =>
    `<span class="key"><span class="sw" style="background:${i.id === 'hp' ? 'var(--elec)' : 'var(--fossil)'}"></span>${i.name}</span>`).join('');
  buildMarkers();
  setSliderVisual(sigma, sigma * MODEL.nHomes);
  await requestHane();
}

async function setLang(l) {
  if (l === LANG) return;
  LANG = l;
  localStorage.setItem('elx-lang', l);
  applyStatic();
  try { await loadLangData(false); } catch (e) { document.getElementById('loadErr').style.display = 'block'; }
}
document.getElementById('langTr').addEventListener('click', () => setLang('tr'));
document.getElementById('langEn').addEventListener('click', () => setLang('en'));

async function init() {
  applyStatic();
  try { await loadLangData(true); } catch (e) { document.getElementById('loadErr').style.display = 'block'; }
}
init();
</script>
</body>
