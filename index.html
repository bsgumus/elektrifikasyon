<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Türkiye Elektrifikasyon Simülatörü</title>
<style>
  :root {
    color-scheme: light;
    --surface-1: #fcfcfb;
    --page: #f9f9f7;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --grid: #e1e0d9;
    --baseline: #c3c2b7;
    --border: rgba(11,11,11,0.10);
    --elec: #2a78d6;
    --elec-track: #cde2fb;
    --fossil: #eb6834;
    --good: #006300;
    --shadow: 0 1px 3px rgba(0,0,0,0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface-1: #1a1a19; --page: #0d0d0d;
      --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #898781;
      --grid: #2c2c2a; --baseline: #383835; --border: rgba(255,255,255,0.10);
      --elec: #3987e5; --elec-track: #184f95; --fossil: #d95926; --good: #0ca30c;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1: #1a1a19; --page: #0d0d0d;
    --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #898781;
    --grid: #2c2c2a; --baseline: #383835; --border: rgba(255,255,255,0.10);
    --elec: #3987e5; --elec-track: #184f95; --fossil: #d95926; --good: #0ca30c;
    --shadow: none;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page); color: var(--text-primary);
    padding: 24px 16px 48px;
  }
  .wrap { max-width: 980px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
  h1 { font-size: 21px; font-weight: 650; }
  .sub { color: var(--text-secondary); font-size: 13px; margin-top: 4px; max-width: 640px; }
  button.reset {
    font: inherit; font-size: 13px; padding: 7px 14px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary);
    cursor: pointer; box-shadow: var(--shadow);
  }
  button.reset:hover { border-color: var(--baseline); }

  .card {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px;
    padding: 18px 20px; box-shadow: var(--shadow); margin-bottom: 14px;
  }

  .hero-top { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .hero-num { font-size: 52px; font-weight: 650; line-height: 1; color: var(--text-primary); }
  .hero-label { font-size: 14px; color: var(--text-secondary); }
  .hero-delta { font-size: 14px; font-weight: 600; }
  .hero-delta.up { color: var(--good); }
  .stat-row { display: flex; gap: 28px; margin-top: 14px; flex-wrap: wrap; }
  .stat .l { font-size: 12px; color: var(--text-muted); }
  .stat .v { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat .d { font-size: 12px; color: var(--good); font-weight: 600; }

  .hero-bar-zone { margin-top: 18px; }
  .hero-bar { position: relative; height: 24px; border-radius: 6px; background: var(--elec-track); overflow: visible; }
  .hero-fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--elec); border-radius: 6px 4px 4px 6px; transition: width .08s; }
  .marker { position: absolute; top: -6px; bottom: -6px; width: 2px; background: var(--text-muted); }
  .marker.target { background: var(--text-primary); }
  .marker-label { position: absolute; top: -24px; transform: translateX(-50%); font-size: 11px; color: var(--text-secondary); white-space: nowrap; }
  .hero-axis { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted); margin-top: 6px; font-variant-numeric: tabular-nums; }

  .legend { display: flex; gap: 18px; align-items: center; font-size: 12.5px; color: var(--text-secondary); margin: 4px 0 12px; flex-wrap: wrap; }
  .key { display: inline-flex; align-items: center; gap: 6px; }
  .sw { width: 12px; height: 12px; border-radius: 3px; }

  .sec { padding: 14px 0 12px; border-top: 1px solid var(--grid); }
  .sec:first-of-type { border-top: none; }
  .sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  .sec-name { font-size: 14.5px; font-weight: 600; }
  .sec-eff { font-size: 11.5px; color: var(--text-muted); font-weight: 400; margin-left: 8px; }
  .sec-nums { font-size: 12.5px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .sec-nums b { color: var(--text-primary); }
  .saved { color: var(--good); font-weight: 600; }

  .rowlab { font-size: 11px; color: var(--text-muted); margin: 6px 0 3px; }
  .cons-bar { position: relative; height: 20px; }
  .seg { position: absolute; top: 0; bottom: 0; }
  .seg.e { background: var(--elec); border-radius: 4px; }
  .seg.f { background: var(--fossil); border-radius: 4px; }
  .ghost { position: absolute; top: 0; bottom: 0; border-radius: 4px; border: 1px dashed var(--baseline); }
  .cons-val { position: absolute; top: 50%; transform: translateY(-50%); font-size: 11.5px; color: var(--text-secondary); white-space: nowrap; font-variant-numeric: tabular-nums; }

  .share-zone { margin-top: 8px; }
  .share-bar {
    position: relative; height: 22px; border-radius: 6px;
    background: var(--elec-track); cursor: ew-resize; touch-action: none;
  }
  .share-bar:focus-visible { outline: 2px solid var(--elec); outline-offset: 2px; }
  .share-fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--elec); border-radius: 6px 4px 4px 6px; }
  .handle {
    position: absolute; top: 50%; transform: translate(-50%, -50%);
    width: 14px; height: 30px; border-radius: 7px;
    background: var(--elec); border: 2px solid var(--surface-1);
    box-shadow: 0 1px 4px rgba(0,0,0,0.25); pointer-events: none;
  }
  .base-tick { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--text-muted); }
  .share-val {
    position: absolute; top: 50%; transform: translateY(-50%);
    font-size: 12px; font-weight: 650; pointer-events: none; font-variant-numeric: tabular-nums;
  }

  .fixedrow .cons-bar .seg.f { background: var(--baseline); }
  .fixedrow .sec-name { color: var(--text-secondary); }

  .chart-title { font-size: 15px; font-weight: 650; }
  .chart-sub { font-size: 12.5px; color: var(--text-secondary); margin: 3px 0 10px; }
  .chart-note { font-size: 11px; color: var(--text-muted); margin-top: 8px; line-height: 1.5; }

  footer { font-size: 11.5px; color: var(--text-muted); line-height: 1.6; margin-top: 18px; }
  footer p { margin-bottom: 4px; }
  .sitenav { display: flex; gap: 6px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  .sitenav .brand { font-size: 13px; font-weight: 650; color: var(--text-secondary); margin-right: 10px; }
  .sitenav a {
    font-size: 13px; text-decoration: none; padding: 6px 12px; border-radius: 8px;
    color: var(--text-secondary); border: 1px solid transparent;
  }
  .sitenav a:hover { border-color: var(--border); }
  .sitenav a.active { background: var(--surface-1); border: 1px solid var(--border); color: var(--text-primary); font-weight: 600; box-shadow: var(--shadow); }
  .lang { margin-left: auto; display: flex; gap: 4px; }
  .lang button {
    font: inherit; font-size: 12px; padding: 4px 10px; border-radius: 7px;
    border: 1px solid transparent; background: none; color: var(--text-muted); cursor: pointer;
  }
  .lang button.active { border-color: var(--border); background: var(--surface-1); color: var(--text-primary); font-weight: 600; box-shadow: var(--shadow); }
  #loadErr { display: none; padding: 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-1); color: var(--text-secondary); font-size: 13px; margin-bottom: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <nav class="sitenav">
    <span class="brand">elektrifikasyon.org</span>
    <a href="index.html" class="active" data-i18n="navSim"></a>
    <a href="ornek-hesaplama.html" data-i18n="navOrnek"></a>
    <a href="otomobil.html" data-i18n="navOto"></a>
    <a href="hane.html" data-i18n="navHane"></a>
    <div class="lang">
      <button id="langTr" type="button">TR</button>
      <button id="langEn" type="button">EN</button>
    </div>
  </nav>
  <header>
    <div>
      <h1 data-i18n="h1"></h1>
      <div class="sub" data-i18n="sub"></div>
    </div>
    <button class="reset" id="resetAll" data-i18n="resetBtn"></button>
  </header>

  <div id="loadErr" data-i18n="loadErr"></div>

  <div class="card" id="heroCard">
    <div class="hero-top">
      <div class="hero-num" id="heroNum">—</div>
      <div>
        <div class="hero-label" data-i18n="heroLabel"></div>
        <div class="hero-delta up" id="heroDelta"></div>
      </div>
    </div>
    <div class="hero-bar-zone">
      <div class="hero-bar" id="heroBar">
        <div class="hero-fill" id="heroFill"></div>
      </div>
      <div class="hero-axis"><span id="axL"></span><span id="axR"></span></div>
    </div>
    <div class="stat-row">
      <div class="stat"><div class="l" data-i18n="stTotL"></div><div class="v" id="stTot"></div><div class="d" id="stTotD"></div></div>
      <div class="stat"><div class="l" data-i18n="stElecL"></div><div class="v" id="stElec"></div><div class="d" id="stElecD"></div></div>
      <div class="stat"><div class="l" data-i18n="stSavedL"></div><div class="v" id="stSaved"></div><div class="d" id="stSavedD"></div></div>
    </div>
  </div>

  <div class="card">
    <div class="legend">
      <span class="key"><span class="sw" style="background:var(--elec)"></span><span data-i18n="legElec"></span></span>
      <span class="key"><span class="sw" style="background:var(--fossil)"></span><span data-i18n="legFuel"></span></span>
      <span class="key"><span class="sw" style="background:transparent;border:1px dashed var(--baseline)"></span><span data-i18n="legRef"></span></span>
    </div>
    <div id="sectors"></div>
  </div>

  <div class="card">
    <div class="chart-title" data-i18n="subsTitle"></div>
    <div class="chart-sub" data-i18n="subsSub"></div>
    <div id="subsectors"></div>
  </div>

  <footer>
    <p data-i18n="footModel"></p>
    <p data-i18n="footData"></p>
    <p data-i18n="footCopy"></p>
  </footer>
</div>

<script>
'use strict';
// Hesaplar sunucu tarafında yapılır (/api). Bu dosyada model katsayısı bulunmaz.
const API = location.hostname === 'localhost'
  ? ''
  : 'https://elektrifikasyon.bahadirsgumus.workers.dev';

let LANG = localStorage.getItem('elx-lang') === 'en' ? 'en' : 'tr';
const LOC = () => LANG === 'en' ? 'en-GB' : 'tr-TR';

const STR = {
  navSim:    { tr: 'Simülatör', en: 'Simulator' },
  navOrnek:  { tr: 'Elektrifikasyon Oranı Yanılgısı', en: 'Electrification Rate Fallacy' },
  navOto:    { tr: 'Otomobillerin Elektrifikasyonu', en: 'Car Electrification' },
  navHane:   { tr: 'Hanelerin Elektrifikasyonu', en: 'Home Electrification' },
  title:     { tr: 'Türkiye Elektrifikasyon Simülatörü', en: 'Türkiye Electrification Simulator' },
  h1:        { tr: 'Türkiye Elektrifikasyon Simülatörü', en: 'Türkiye Electrification Simulator' },
  sub:       { tr: 'Sektörlerin elektrifikasyon oranı çubuklarını sürükleyin: yakıt tüketimi verim çarpanına göre elektriğe dönüşür, sektör ve Türkiye toplam tüketimi düşer, genel oran anında yeniden hesaplanır.',
               en: 'Drag the sector electrification bars: fuel consumption is replaced by electricity according to the efficiency factor, sector and national totals fall, and the overall rate is recalculated instantly.' },
  resetBtn:  { tr: '↺ 2024’e dön', en: '↺ Back to 2024' },
  loadErr:   { tr: 'Hesap servisine ulaşılamadı. Sayfayı yenileyin; sorun sürerse daha sonra tekrar deneyin.',
               en: 'The calculation service could not be reached. Refresh the page; if the problem persists, try again later.' },
  heroLabel: { tr: 'Nihai enerji tüketiminde elektriğin payı', en: 'Share of electricity in final energy consumption' },
  stTotL:    { tr: 'Toplam nihai tüketim', en: 'Total final consumption' },
  stElecL:   { tr: 'Elektrik tüketimi', en: 'Electricity consumption' },
  stSavedL:  { tr: 'İkame edilen yakıt', en: 'Fuel displaced' },
  legElec:   { tr: 'Elektrik', en: 'Electricity' },
  legFuel:   { tr: 'Fosil yakıtlar', en: 'Fossil fuels' },
  legRef:    { tr: '2024 tüketimi (referans)', en: '2024 consumption (reference)' },
  subsTitle: { tr: 'Alt sektörler', en: 'Sub-sectors' },
  subsSub:   { tr: 'Seçilmiş sanayi alt sektörleri ve demiryolları. Tüketim çubukları bu bölümün kendi ölçeğindedir (en büyük alt sektör = tam genişlik). Ana sektör kaydırıcısı ilgili yakıtın bir bölümünü zaten elektriğe çevirdiyse, alt sektör kaydırıcısı <b>kalan yakıta</b> uygulanır — böylece çifte sayım oluşmaz. Alt sektör hamleleri Türkiye toplamına doğrudan yansır; ana sektör satırındaki sayılar yalnızca ana kaydırıcının durumunu gösterir. Şeker Üretimi, Gıda Ürünleri İmalatı’nın alt kümesidir.',
               en: 'Selected industrial sub-sectors and railways. Consumption bars use this section’s own scale (largest sub-sector = full width). If the main sector slider has already converted part of the fuel, the sub-sector slider applies to the <b>remaining fuel</b> — so nothing is double-counted. Sub-sector moves feed directly into the national total; the main sector row reflects only its own slider. Sugar Production is a subset of Food Products Manufacturing.' },
  footModel: { tr: '<b>Model:</b> Bir sektörde elektrifikasyon oranını artırdığınızda, yakıt tüketiminin bir bölümü elektrikle ikame edilir. İkame edilen her birim hizmet için elektrik, yakıtın 1/çarpan’ı kadar enerji tüketir (ör. otomobilde 4× verim → 4 birim yakıt yerine 1 birim elektrik). Bu yüzden oran arttıkça sektörün toplam tüketimi de düşer. Ulaştırma sektörünün çarpanı (2,3×), otomobil (4×, yakıtın %40’ı) ile ağır vasıtanın (1,8×, %60) harmanıdır.',
               en: '<b>Model:</b> When you raise a sector’s electrification rate, part of its fuel consumption is replaced by electricity. For each unit of service converted, electricity uses only 1/factor of the fuel energy (e.g. a 4× factor for cars → 1 unit of electricity replaces 4 units of fuel). This is why the sector’s total consumption falls as the rate rises. The transport sector’s factor (2.3×) blends cars (4×, 40% of fuel) with heavy vehicles (1.8×, 60%).' },
  footData:  { tr: '<b>Veri:</b> ETKB 2024 Yılı Ulusal Enerji Denge Tablosu (r1, 15.11.2025), bin TEP, net kalorifik değer. Nihai tüketim, enerji dışı tüketim (petrokimya hammaddesi, bitüm vb.) hariç tanımlanır: başlangıç payı %21,80 = 26.340,5 / 120.829,9 bin TEP (beş sektörün toplamı; istatistiksel fark da payda dışıdır). Bu tanım, Ulusal Enerji Planı’nın 2020 baz değeriyle (%21,8) doğrudan karşılaştırılabilir. Verim çarpanları gösterge niteliğindedir. 1 bin TEP = 11,63 GWh. Grafiklerde “fosil yakıtlar” olarak gösterilen bölüm, elektrik dışı tüm nihai tüketimi kapsar; ağırlıkla fosil yakıtlardan oluşmakla birlikte az miktarda biyokütle, güneş ısısı ve jeotermal ısıyı da içerir.',
               en: '<b>Data:</b> Ministry of Energy (ETKB) 2024 National Energy Balance Table (r1, 15 Nov 2025), ktoe, net calorific value. Final consumption is defined excluding non-energy use (petrochemical feedstock, bitumen, etc.): the starting share is 21.80% = 26,340.5 / 120,829.9 ktoe (the sum of the five sectors; the statistical difference is likewise outside the denominator). This definition is directly comparable with the National Energy Plan’s 2020 baseline (21.8%). Efficiency factors are indicative. 1 ktoe = 11.63 GWh. The portion shown as “fossil fuels” in the charts covers all non-electric final consumption; it is predominantly fossil fuels but also includes small amounts of biomass, solar heat and geothermal heat.' },
  footCopy:  { tr: '© 2026 elektrifikasyon.org — Tüm hakları saklıdır. İçerik ve hesaplama modeli izinsiz kopyalanamaz.',
               en: '© 2026 elektrifikasyon.org — All rights reserved. The content and calculation model may not be copied without permission.' },
  rowCons:   { tr: 'Yıllık tüketim (2024 referansına göre)', en: 'Annual consumption (relative to 2024)' },
  rowShare:  { tr: 'Elektrifikasyon oranı — sürükleyin', en: 'Electrification rate — drag' },
  tickTitle: { tr: '2024 oranı', en: '2024 rate' },
  numsTpl:   { tr: 'Elektrik <b>{E}</b> · toplam <b>{T}</b>', en: 'Electricity <b>{E}</b> · total <b>{T}</b>' },
  delta0:    { tr: '2024 gerçekleşmesi', en: '2024 actual' },
  deltaTpl:  { tr: '+{d} puan (2024: {b})', en: '+{d} pts (2024: {b})' },
  vs2024:    { tr: '(2024’e göre)', en: '(vs 2024)' },
  mkNEP:     { tr: 'UEP 2035: %24,9', en: 'NEP 2035: 24.9%' },
  mkTarget:  { tr: 'Hedef: %35', en: 'Target: 35%' },
};
const T = k => STR[k][LANG];

const fmtNum = (v, d) => v.toLocaleString(LOC(), { minimumFractionDigits: d, maximumFractionDigits: d });
const fmtPctN = (v100, d) => LANG === 'en' ? fmtNum(v100, d) + '%' : '%' + fmtNum(v100, d);
const fmtPct1 = v => fmtPctN(v * 100, 1);
const fmtPct2 = v => fmtPctN(v * 100, 2);
const fmtMtep = v => fmtNum(v / 1000, 1) + (LANG === 'en' ? ' Mtoe' : ' Mtep');
const fmtTWh  = v => Math.round(v * 11.63 / 1000).toLocaleString(LOC()) + ' TWh';
const axPct   = v => LANG === 'en' ? v + '%' : '%' + v;

let MODEL = null;
let MAX_T = 1;
let MAX_S = 1;
const state = { shares: {}, subs: {} };

async function getJSON(path, opts) {
  const sep = path.includes('?') ? '&' : '?';
  const r = await fetch(API + path + (opts && opts.method === 'POST' ? '' : sep + 'lang=' + LANG), opts);
  if (!r.ok) throw new Error('api ' + r.status);
  return r.json();
}

function applyStatic() {
  document.documentElement.lang = LANG;
  document.title = T('title');
  document.querySelectorAll('[data-i18n]').forEach(el => { el.innerHTML = T(el.dataset.i18n); });
  document.getElementById('axL').textContent = axPct(0);
  document.getElementById('axR').textContent = axPct(50);
  document.getElementById('langTr').classList.toggle('active', LANG === 'tr');
  document.getElementById('langEn').classList.toggle('active', LANG === 'en');
}

function rowHTML(sec) {
  return `
      <div class="sec-head">
        <div class="sec-name">${sec.name}<span class="sec-eff">${sec.eff}</span></div>
        <div class="sec-nums" id="nums-${sec.id}"></div>
      </div>
      <div class="rowlab">${T('rowCons')}</div>
      <div class="cons-bar">
        <div class="ghost" id="ghost-${sec.id}"></div>
        <div class="seg e" id="segE-${sec.id}"></div>
        <div class="seg f" id="segF-${sec.id}"></div>
        <div class="cons-val" id="consV-${sec.id}"></div>
      </div>
      <div class="share-zone">
        <div class="rowlab">${T('rowShare')}</div>
        <div class="share-bar" id="bar-${sec.id}" tabindex="0" role="slider"
             aria-label="${sec.name}" aria-valuemin="${Math.round(sec.s0*100)}" aria-valuemax="100">
          <div class="share-fill" id="fill-${sec.id}"></div>
          <div class="base-tick" id="tick-${sec.id}" title="${T('tickTitle')}"></div>
          <div class="handle" id="hnd-${sec.id}"></div>
          <div class="share-val" id="shv-${sec.id}"></div>
        </div>
      </div>`;
}

function buildSectorDOM() {
  const host = document.getElementById('sectors');
  host.innerHTML = '';
  for (const sec of MODEL.sectors) {
    const el = document.createElement('div');
    el.className = 'sec';
    el.innerHTML = rowHTML(sec);
    host.appendChild(el);
    attachDrag(sec, state.shares);
  }
}

function buildSubDOM() {
  const host = document.getElementById('subsectors');
  host.innerHTML = '';
  for (const sub of MODEL.subs) {
    const el = document.createElement('div');
    el.className = 'sec';
    el.innerHTML = rowHTML(sub);
    host.appendChild(el);
    attachDrag(sub, state.subs);
  }
}

function setSliderVisual(sec, s) {
  const sPct = s * 100;
  document.getElementById('fill-' + sec.id).style.width = sPct + '%';
  document.getElementById('hnd-' + sec.id).style.left = sPct + '%';
  document.getElementById('tick-' + sec.id).style.left = (sec.s0*100) + '%';
  const shv = document.getElementById('shv-' + sec.id);
  shv.textContent = fmtPct1(s);
  if (sPct > 14) { shv.style.cssText = `left:${sPct - 1.5}%; transform:translate(-100%,-50%); color:#fff;`; }
  else { shv.style.cssText = `left:${sPct + 2.5}%; transform:translateY(-50%); color:var(--text-primary);`; }
  document.getElementById('bar-' + sec.id).setAttribute('aria-valuenow', Math.round(sPct));
}

function attachDrag(sec, bucket) {
  const bar = document.getElementById('bar-' + sec.id);
  const setFromEvent = ev => {
    const rect = bar.getBoundingClientRect();
    let s = (ev.clientX - rect.left) / rect.width;
    s = Math.max(sec.s0, Math.min(1, s));
    bucket[sec.id] = s;
    setSliderVisual(sec, s);
    requestHesap();
  };
  bar.addEventListener('pointerdown', ev => {
    try { bar.setPointerCapture(ev.pointerId); } catch (e) { /* sentetik olaylarda yok sayılır */ }
    setFromEvent(ev);
    const move = e => setFromEvent(e);
    const up = () => { bar.removeEventListener('pointermove', move); bar.removeEventListener('pointerup', up); };
    bar.addEventListener('pointermove', move);
    bar.addEventListener('pointerup', up);
  });
  bar.addEventListener('keydown', ev => {
    const step = ev.shiftKey ? 0.10 : 0.01;
    let s = bucket[sec.id];
    if (ev.key === 'ArrowRight' || ev.key === 'ArrowUp') s = Math.min(1, s + step);
    else if (ev.key === 'ArrowLeft' || ev.key === 'ArrowDown') s = Math.max(sec.s0, s - step);
    else if (ev.key === 'Home') s = sec.s0;
    else return;
    ev.preventDefault();
    bucket[sec.id] = s;
    setSliderVisual(sec, s);
    requestHesap();
  });
  bar.addEventListener('dblclick', () => {
    bucket[sec.id] = sec.s0;
    setSliderVisual(sec, sec.s0);
    requestHesap();
  });
}

// istekler seri hâlde birleştirilir
let busy = false, queued = false;
async function requestHesap() {
  if (busy) { queued = true; return; }
  busy = true;
  try {
    do { queued = false; await hesapla(); } while (queued);
  } finally { busy = false; }
}
async function hesapla() {
  try {
    const res = await getJSON('/api/hesap', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ shares: state.shares, subs: state.subs }),
    });
    applyResult(res);
  } catch (e) {
    document.getElementById('loadErr').style.display = 'block';
  }
}

const numsTpl = (E, Tt) => T('numsTpl').replace('{E}', fmtTWh(E)).replace('{T}', fmtMtep(Tt));

function applyResult(res) {
  document.getElementById('loadErr').style.display = 'none';
  const gap = 0.25;
  for (const sec of MODEL.sectors) {
    const r = res.sectors[sec.id];
    const wT0 = sec.T0 / MAX_T * 100;
    const wE = r.E / MAX_T * 100, wF = r.F / MAX_T * 100;
    document.getElementById('ghost-' + sec.id).style.cssText = `left:0; width:${wT0}%`;
    document.getElementById('segE-' + sec.id).style.cssText = `left:0; width:${wE}%`;
    document.getElementById('segF-' + sec.id).style.cssText = `left:${wE + gap}%; width:${Math.max(0, wF - gap)}%`;
    const saved = sec.T0 - r.T;
    const cv = document.getElementById('consV-' + sec.id);
    cv.style.left = Math.max(wT0, wE + wF) + 1.5 + '%';
    cv.innerHTML = fmtMtep(r.T) + (saved > 5 ? ` <span class="saved">(−${fmtMtep(saved)})</span>` : '');
    document.getElementById('nums-' + sec.id).innerHTML = numsTpl(r.E, r.T);
    if (!queued) {
      state.shares[sec.id] = r.s;
      setSliderVisual(sec, r.s);
    }
  }
  for (const sub of (MODEL.subs || [])) {
    const r = res.subs?.[sub.id];
    if (!r) continue;
    const wT0 = sub.T0 / MAX_S * 100;
    const wE = r.E / MAX_S * 100, wF = r.F / MAX_S * 100;
    document.getElementById('ghost-' + sub.id).style.cssText = `left:0; width:${wT0}%`;
    document.getElementById('segE-' + sub.id).style.cssText = `left:0; width:${wE}%`;
    document.getElementById('segF-' + sub.id).style.cssText = `left:${wE + gap}%; width:${Math.max(0, wF - gap)}%`;
    const saved = sub.T0 - r.T;
    const cv = document.getElementById('consV-' + sub.id);
    cv.style.left = Math.max(wT0, wE + wF) + 1.5 + '%';
    cv.innerHTML = fmtMtep(r.T) + (saved > 5 ? ` <span class="saved">(−${fmtMtep(saved)})</span>` : '');
    document.getElementById('nums-' + sub.id).innerHTML = numsTpl(r.E, r.T);
    // Sunucunun türettiği pay yalnızca görsel olarak yansıtılır; kullanıcının
    // talebi (state.subs) EZİLMEZ — aksi hâlde ana sektör geri çekildiğinde
    // alt sektörler yüksek payda kilitli kalır.
    if (!queued) setSliderVisual(sub, r.s);
  }
  const t = res.totals;
  document.getElementById('heroNum').textContent = fmtPct2(t.share);
  document.getElementById('heroFill').style.width = Math.min(100, t.share/0.5*100) + '%';
  const d = (t.share - t.share0) * 100;
  document.getElementById('heroDelta').textContent = d > 0.005
    ? T('deltaTpl').replace('{d}', fmtNum(d, 2)).replace('{b}', fmtPct2(t.share0))
    : T('delta0');
  document.getElementById('stTot').textContent = fmtMtep(t.Ttot);
  document.getElementById('stElec').textContent = fmtTWh(t.Etot);
  document.getElementById('stSaved').textContent = fmtMtep(t.saved);
  document.getElementById('stTotD').textContent = t.saved > 5 ? `−${fmtMtep(t.saved)} ${T('vs2024')}` : '';
  const E0tot = t.E0tot ?? t.share0 * t.T0tot;
  document.getElementById('stElecD').textContent = (t.Etot - E0tot) > 5 ? `+${fmtTWh(t.Etot - E0tot)}` : '';
  document.getElementById('stSavedD').textContent = '';
}

function addHeroMarkers() {
  const bar = document.getElementById('heroBar');
  bar.querySelectorAll('.marker, .marker-label').forEach(el => el.remove());
  for (const m of [ {v:24.9, label:T('mkNEP'), cls:''}, {v:35, label:T('mkTarget'), cls:'target'} ]) {
    const x = m.v / 50 * 100;
    const mk = document.createElement('div');
    mk.className = 'marker ' + m.cls; mk.style.left = x + '%';
    const lb = document.createElement('div');
    lb.className = 'marker-label'; lb.style.left = x + '%'; lb.textContent = m.label;
    bar.appendChild(mk); bar.appendChild(lb);
  }
}

document.getElementById('resetAll').addEventListener('click', () => {
  for (const sec of MODEL.sectors) {
    state.shares[sec.id] = sec.s0;
    setSliderVisual(sec, sec.s0);
  }
  for (const sub of (MODEL.subs || [])) {
    state.subs[sub.id] = sub.s0;
    setSliderVisual(sub, sub.s0);
  }
  requestHesap();
});

async function loadLangData(firstLoad) {
  MODEL = await getJSON('/api/model');
  MODEL.subs = MODEL.subs || [];
  MAX_T = Math.max(...MODEL.sectors.map(s => s.T0));
  MAX_S = Math.max(1, ...MODEL.subs.map(s => s.T0));
  if (firstLoad) {
    for (const sec of MODEL.sectors) state.shares[sec.id] = sec.s0;
    for (const sub of MODEL.subs) state.subs[sub.id] = sub.s0;
  }
  buildSectorDOM();
  buildSubDOM();
  addHeroMarkers();
  for (const sec of MODEL.sectors) setSliderVisual(sec, state.shares[sec.id]);
  for (const sub of MODEL.subs) setSliderVisual(sub, state.subs[sub.id]);
  await hesapla();
}

async function setLang(l) {
  if (l === LANG) return;
  LANG = l;
  localStorage.setItem('elx-lang', l);
  applyStatic();
  try { await loadLangData(false); } catch (e) { document.getElementById('loadErr').style.display = 'block'; }
}
document.getElementById('langTr').addEventListener('click', () => setLang('tr'));
document.getElementById('langEn').addEventListener('click', () => setLang('en'));

async function init() {
  applyStatic();
  try { await loadLangData(true); } catch (e) { document.getElementById('loadErr').style.display = 'block'; }
}
init();
</script>
